# ToolHost Local release pipeline. Push a v* tag and
# .github/workflows/release.yml runs this as a draft, signs the checksums
# (cosign keyless), attests build provenance, verifies all of it, then
# un-drafts the release. Only then is the Homebrew cask, written here to
# dist/homebrew/Casks, pushed to the tap: it never points at assets that
# failed verification. Nothing else is published (no image, no registry).
version: 2

project_name: toolhost

release:
  draft: true

builds:
  - id: toolhost
    main: ./cmd/toolhost
    binary: toolhost
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/gettoolhost/toolhost-local/internal/core.Version={{.Version}}
    env: [CGO_ENABLED=0]

archives:
  - formats: [tar.gz]
    name_template: "toolhost_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github-native

# Homebrew: `brew install gettoolhost/tap/toolhost`. The workflow pushes
# the cask after verification, so goreleaser only writes it.
homebrew_casks:
  - name: toolhost
    repository:
      owner: gettoolhost
      name: homebrew-tap
    directory: Casks
    skip_upload: true
    binaries: [toolhost]
    homepage: https://github.com/gettoolhost/toolhost-local
    description: "Local MCP gateway: your agents see only the tools you approved"
    hooks:
      post:
        # The binary isn't notarised. Homebrew quarantines what it
        # downloads, and Gatekeeper would refuse to run it; install.sh
        # clears the same attribute.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/toolhost"]
          end
