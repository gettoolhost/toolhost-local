name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create/edit the GitHub release
  packages: write      # push the OCI image to ghcr.io
  id-token: write      # cosign keyless signing + provenance + MCP registry OIDC
  attestations: write  # actions/attest-build-provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.2"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: ghcr login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build + draft release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # The Actions GITHUB_TOKEN can't push to homebrew-tap — a PAT or
          # GitHub App token with repo scope on both repos is required.
          GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Sign checksums (keyless)
        run: |
          cd dist
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt
          gh release upload "${GITHUB_REF_NAME}" checksums.txt.sigstore.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Verify before publish
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          gh release download "${GITHUB_REF_NAME}" \
            -p 'checksums.txt' -p 'checksums.txt.sigstore.json' -p 'toolhost_*'
          # the checksums file's cosign signature is the root of trust —
          # verify it before trusting its contents
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp 'https://github.com/gettoolhost/toolhost-local/.github/workflows/release.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          sha256sum -c checksums.txt --ignore-missing
          # every archive on the release must be covered by the checksums
          count=$(ls toolhost_* | wc -l)
          covered=$(grep -c 'toolhost_' checksums.txt)
          [ "$count" -eq "$covered" ]
          # provenance attestation for each archive
          for f in toolhost_*; do
            gh attestation verify "$f" -R gettoolhost/toolhost-local
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish (un-draft)
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
