name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create/edit the GitHub release
  id-token: write      # cosign keyless signing + provenance
  attestations: write  # actions/attest-build-provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.2"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      # Release notes are written by hand when .github/release-notes/<tag>.md
      # exists; otherwise GitHub generates them from the merged PRs.
      - name: Release notes
        id: notes
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "args=--release-notes=$f" >> "$GITHUB_OUTPUT"; fi
      - name: Build + draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.20.3"
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Kept with the run, so the cask can be published by hand when the
      # tap token below isn't set.
      - name: Keep the cask
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/toolhost.rb
          if-no-files-found: error
      - name: Sign checksums (keyless)
        run: |
          cd dist
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt
          gh release upload "${GITHUB_REF_NAME}" checksums.txt.sigstore.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/toolhost_*.tar.gz
            dist/toolhost_*.zip
            dist/checksums.txt
      - name: Verify before publish
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          gh release download "${GITHUB_REF_NAME}" \
            -p 'checksums.txt' -p 'checksums.txt.sigstore.json' -p 'toolhost_*'
          # the checksums file's cosign signature is the root of trust —
          # verify it before trusting its contents
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp 'https://github.com/gettoolhost/toolhost-local/.github/workflows/release.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          sha256sum -c checksums.txt --ignore-missing
          # every archive on the release must be covered by the checksums
          count=$(ls toolhost_* | wc -l)
          covered=$(grep -c 'toolhost_' checksums.txt)
          [ "$count" -eq "$covered" ]
          # provenance attestation for each archive
          for f in toolhost_*; do
            gh attestation verify "$f" -R gettoolhost/toolhost-local
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish (un-draft)
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only now, with the assets verified and public, does the cask go to
      # the tap. The Actions GITHUB_TOKEN can't write to another repo, so
      # this needs TAP_GITHUB_TOKEN (contents: write on homebrew-tap);
      # without it the step says so and the cask waits in the artifact.
      - name: Publish the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set; the cask is in the homebrew-cask artifact, not the tap"
            exit 0
          fi
          path=repos/gettoolhost/homebrew-tap/contents/Casks/toolhost.rb
          sha=$(gh api "$path" --jq .sha 2>/dev/null || true)
          gh api -X PUT "$path" \
            -f message="toolhost ${GITHUB_REF_NAME}" \
            -f content="$(base64 -w0 dist/homebrew/Casks/toolhost.rb)" \
            ${sha:+-f sha="$sha"} >/dev/null
          echo "cask for ${GITHUB_REF_NAME} pushed to gettoolhost/homebrew-tap"
