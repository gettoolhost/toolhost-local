<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">The Three-Tier Governance Model — toolhost</title>
  <desc id="desc">Discovered tools pass a human-only approve boundary with schema pinning, and the agent enables only what it needs. A petition loop lets agents request more without crossing the boundary.</desc>

  <defs>
    <marker id="ah-gray" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 .6 L8.6 4 L0 7.4" fill="none" stroke="#8A897B" stroke-width="1.6"/>
    </marker>
    <marker id="ah-clay" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 .6 L8.6 4 L0 7.4" fill="none" stroke="#D97757" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1280" height="680" fill="#E9E8DE"/>
  <rect x="28" y="24" width="1224" height="632" rx="18" fill="#FBFBF7" stroke="#DCDACC" stroke-width="1"/>

  <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- Header -->
    <text x="64" y="68" fill="#B85C3E" font-size="12" letter-spacing="4" font-weight="700">TOOLHOST</text>
    <text x="164" y="68" fill="#8A897B" font-size="12" letter-spacing="1.5">GOVERNANCE MODEL</text>
    <text x="64" y="100" fill="#26221B" font-size="24" font-weight="700" letter-spacing="-.3">The three-tier gate — discovered ≠ approved ≠ enabled</text>
    <text x="1216" y="68" fill="#8A897B" font-size="12" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">humans own approval · agents own enablement</text>

    <!-- Tier 1: Discovered -->
    <rect x="64" y="132" width="344" height="296" rx="12" fill="#F1F1E9" stroke="#E2E0D4" stroke-width="1"/>
    <text x="86" y="162" fill="#55554B" font-size="13" font-weight="700">1. Discovered</text>
    <text x="86" y="180" fill="#8A897B" font-size="11">Everything upstreams expose — cataloged, not callable</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">
      <rect x="86" y="198" width="144" height="26" rx="5" fill="#FDFDFB" stroke="#D2D0C2"/><text x="96" y="215" fill="#55554B">fs__read_file</text>
      <rect x="242" y="198" width="144" height="26" rx="5" fill="#FDFDFB" stroke="#D2D0C2"/><text x="252" y="215" fill="#55554B">fs__write_file</text>
      <rect x="86" y="232" width="144" height="26" rx="5" fill="#FDFDFB" stroke="#D2D0C2"/><text x="96" y="249" fill="#55554B">fs__edit_file</text>
      <rect x="242" y="232" width="144" height="26" rx="5" fill="#FDFDFB" stroke="#D2D0C2"/><text x="252" y="249" fill="#55554B">fs__list_dir</text>
      <rect x="86" y="266" width="144" height="26" rx="5" fill="#FDFDFB" stroke="#D2D0C2"/><text x="96" y="283" fill="#55554B">gh__search</text>
      <rect x="242" y="266" width="144" height="26" rx="5" fill="#FDFDFB" stroke="#D2D0C2"/><text x="252" y="283" fill="#55554B">db__query</text>
      <rect x="86" y="300" width="144" height="26" rx="5" fill="#FDFDFB" stroke="#D2D0C2"/><text x="96" y="317" fill="#55554B">db__migrate</text>
      <rect x="242" y="300" width="144" height="26" rx="5" fill="#FDFDFB" stroke="#D2D0C2"/><text x="252" y="317" fill="#55554B">ln__issue</text>
    </g>

    <text x="86" y="364" fill="#8A897B" font-size="11">Catalog populates automatically on connect</text>
    <text x="86" y="382" fill="#55554B" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">gateway__discover reads this catalog</text>

    <!-- Boundary 1: Human Approves -->
    <path d="M440 132 V 438" stroke="#D97757" stroke-width="1.8" stroke-dasharray="6 5"/>
    <g transform="translate(440, 452)">
      <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#F3F2EA" stroke="#DCDACC"/>
      <text x="0" y="4" fill="#B85C3E" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">toolhost approve</text>
    </g>

    <!-- Tier 2: Approved -->
    <rect x="472" y="132" width="336" height="296" rx="12" fill="#FDFDFB" stroke="#DCDACC" stroke-width="1.3"/>
    <text x="494" y="162" fill="#26221B" font-size="13" font-weight="700">2. Approved</text>
    <text x="494" y="180" fill="#8A897B" font-size="11">The human's trust envelope — pinned by schema hash</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">
      <rect x="494" y="198" width="292" height="34" rx="6" fill="#FAFBF8" stroke="#8A897B" stroke-width="1.1"/>
      <text x="506" y="219" fill="#26221B" font-weight="600">fs__read_file</text>
      <text x="772" y="219" fill="#8A897B" font-size="9" text-anchor="end">sha256:4a8b…3f</text>

      <rect x="494" y="240" width="292" height="34" rx="6" fill="#FAFBF8" stroke="#8A897B" stroke-width="1.1"/>
      <text x="506" y="261" fill="#26221B" font-weight="600">fs__list_dir</text>
      <text x="772" y="261" fill="#8A897B" font-size="9" text-anchor="end">sha256:91c2…e8</text>

      <rect x="494" y="282" width="292" height="34" rx="6" fill="#FAFBF8" stroke="#8A897B" stroke-width="1.1"/>
      <text x="506" y="303" fill="#26221B" font-weight="600">gh__search</text>
      <text x="772" y="303" fill="#8A897B" font-size="9" text-anchor="end">sha256:d50e…12</text>
    </g>

    <text x="494" y="364" fill="#B85C3E" font-size="11" font-weight="600">Upstream drift voids the pin — the tool locks</text>
    <text x="494" y="382" fill="#8A897B" font-size="11">until a human re-approves the new contract</text>

    <!-- Boundary 2: Agent Enables -->
    <path d="M838 132 V 438" stroke="#8A897B" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g transform="translate(838, 452)">
      <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#F3F2EA" stroke="#DCDACC"/>
      <text x="0" y="4" fill="#55554B" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">gateway__enable</text>
    </g>

    <!-- Tier 3: Enabled -->
    <rect x="870" y="132" width="344" height="296" rx="12" fill="#FAFBF8" stroke="#D97757" stroke-width="1.8"/>
    <text x="892" y="162" fill="#B85C3E" font-size="13" font-weight="700">3. Enabled</text>
    <text x="892" y="180" fill="#8A897B" font-size="11">The live surface — what tools/list advertises</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
      <rect x="892" y="198" width="300" height="38" rx="7" fill="#D97757"/>
      <text x="906" y="222" fill="#FBFBF7" font-weight="700">fs__read_file</text>
      <circle cx="1168" cy="217" r="4" fill="#FBFBF7"/>
      <text x="1154" y="221" fill="#FBFBF7" font-size="9" text-anchor="end">active</text>

      <rect x="892" y="244" width="300" height="38" rx="7" fill="#FDFDFB" stroke="#8A897B" stroke-width="1.1" stroke-dasharray="4 4"/>
      <text x="906" y="268" fill="#8A897B">fs__list_dir</text>
      <text x="1168" y="268" fill="#8A897B" font-size="9" text-anchor="end">approved, off</text>

      <rect x="892" y="290" width="300" height="38" rx="7" fill="#FDFDFB" stroke="#8A897B" stroke-width="1.1" stroke-dasharray="4 4"/>
      <text x="906" y="314" fill="#8A897B">gh__search</text>
      <text x="1168" y="314" fill="#8A897B" font-size="9" text-anchor="end">approved, off</text>
    </g>

    <text x="892" y="364" fill="#26221B" font-size="11" font-weight="600">Strict subset invariant: enabled ⊆ approved</text>
    <text x="892" y="382" fill="#55554B" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">gateway__call hits only this ring</text>

    <!-- Petition Loop -->
    <rect x="64" y="468" width="1150" height="156" rx="12" fill="#F3F2EA" stroke="#DCDACC" stroke-width="1"/>
    <text x="86" y="496" fill="#6E6D62" font-size="11" font-weight="700" letter-spacing="1.2">PETITION LOOP — THE AGENT ASKS, IT NEVER APPROVES</text>

    <g transform="translate(86, 514)">
      <rect width="260" height="88" rx="8" fill="#FDFDFB" stroke="#8A897B" stroke-width="1.2"/>
      <text x="16" y="26" fill="#26221B" font-size="12" font-weight="700">1. Agent petitions</text>
      <text x="16" y="46" fill="#55554B" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">gateway__request gh__search</text>
      <text x="16" y="66" fill="#8A897B" font-size="10">or a whole proposed server</text>
    </g>

    <path d="M346 558 H 430" stroke="#8A897B" stroke-width="1.5" marker-end="url(#ah-gray)"/>

    <g transform="translate(432, 514)">
      <rect width="280" height="88" rx="8" fill="#FDFDFB" stroke="#8A897B" stroke-width="1.2"/>
      <text x="16" y="26" fill="#26221B" font-size="12" font-weight="700">2. Petition queue</text>
      <text x="16" y="46" fill="#55554B" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">toolhost_requests.json</text>
      <text x="16" y="66" fill="#8A897B" font-size="10">persistent · deduplicated · denied stays denied</text>
    </g>

    <path d="M712 558 H 796" stroke="#8A897B" stroke-width="1.5" marker-end="url(#ah-gray)"/>

    <g transform="translate(798, 514)">
      <rect width="390" height="88" rx="8" fill="#FDFDFB" stroke="#D97757" stroke-width="1.6"/>
      <text x="16" y="24" fill="#26221B" font-size="12" font-weight="700">3. Human verdict</text>
      <text x="16" y="44" fill="#B85C3E" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">toolhost requests --accept / --deny</text>
      <g font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
        <text x="16" y="64" fill="#B85C3E">accept → pinned into approved (or server materialized)</text>
        <text x="16" y="78" fill="#8A897B">deny   → verdict returns; the same ask can't re-file</text>
      </g>
    </g>

    <!-- boundary pills paint last — they ride the seam, above the cards -->
    <g transform="translate(440, 150)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#D97757"/>
      <text x="0" y="4" fill="#FBFBF7" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">HUMAN APPROVES</text>
    </g>
    <g transform="translate(838, 150)">
      <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#55554B"/>
      <text x="0" y="4" fill="#F1F1E9" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.2">AGENT ENABLES</text>
    </g>

    <!-- promote path: elbow connector, straight segments -->
    <path d="M1000 514 V 434 H 610 V 428" stroke="#D97757" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ah-clay)" fill="none"/>
    <rect x="660" y="425" width="150" height="18" rx="4" fill="#FBFBF7" stroke="#DCDACC"/>
    <text x="735" y="438" fill="#B85C3E" font-size="9.5" font-weight="700" text-anchor="middle">APPROVED → PINNED IN</text>
  </g>
</svg>
